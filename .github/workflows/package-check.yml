name: Package check

# Dry run only. Releases are built by CurseForge's own packager from the tag
# webhook, against the same .pkgmeta: this job exists so a packaging mistake
# surfaces on a pull request instead of in a published zip. (AltStable's recipe.)
#
# -d is the real no-upload switch: merely leaving CF_API_KEY out still lets the
# packager cut a GitHub release.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      # The embedded LibGlass-1.0 at the ref .pkgmeta pins (read from there,
      # never written twice), checked to BE that commit. The tests load it
      # from $LIBGLASS, the packager fetches the same pin into Libs/LibGlass-1.0.
      - name: Fetch LibGlass at the pinned ref
        run: |
          bash tests/fetch_libglass.sh "$RUNNER_TEMP/LibGlass"
          echo "LIBGLASS=$RUNNER_TEMP/LibGlass" >> "$GITHUB_ENV"

      # WoW runs Lua 5.1, so the tests do too. tests/run.ps1 is the Windows entry
      # point for the same files. find, not globs: Libs/ nests deeper than one level.
      - name: Syntax-check every shipped Lua file
        run: |
          count=$(find . -name '*.lua' -not -path './.git/*' | wc -l)
          test "$count" -gt 0 || { echo "no Lua files found - the check would prove nothing"; exit 1; }
          echo "checking $count files"
          find . -name '*.lua' -not -path './.git/*' -print0 | xargs -0 luac5.1 -p

      # Without the API dump (not on CI), test_toc skips the events fixture check
      # and test_methods skips itself, loudly; everything else runs.
      - name: Unit tests
        run: |
          for f in tests/test_*.lua; do
            echo "-- $f"
            lua5.1 "$f" || exit 1
          done

      # Pinned to a SHA, not the moving v2 tag (AltStable's: v2 has moved once already).
      - name: Package (dry run)
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0
        with:
          args: -d

      # The zip is what players install: assert its SHAPE rather than trusting
      # .pkgmeta to have been read the way it was meant.
      - name: The package has the addon, and nothing private
        run: |
          zip=$(ls .release/*.zip | head -1)
          rm -rf unpacked && mkdir unpacked && unzip -q "$zip" -d unpacked
          (cd unpacked && find . -type f | sed 's|^\./||' | sort) > files.txt
          echo "$(wc -l < files.txt) files in $zip"

          fail=0

          # What the client needs. Bindings.xml isn't in the TOC (the client finds
          # it by name), so it is named here.
          for f in GuildSpy/GuildSpy.toc \
                   GuildSpy/LICENSE \
                   GuildSpy/Compat.lua \
                   GuildSpy/Bindings.xml \
                   GuildSpy/GuildSpy.lua; do
            grep -qx "$f" files.txt || { echo "MISSING from the package: $f"; fail=1; }
          done

          # Every file the TOC lists ships.
          for f in $(grep -vE '^\s*(#|$)' GuildSpy.toc | tr -d '\r' | tr '\\' '/'); do
            grep -qx "GuildSpy/$f" files.txt || { echo "MISSING (listed in the TOC): $f"; fail=1; }
          done

          # Development files must not ship.
          for pat in '/tests/' '/Tools/' '/docs/' '/\.github/' '/\.claude/' \
                     'AGENTS\.md$' 'CLAUDE\.md$' 'CHANGELOG\.md$' 'README\.md$' '\.ps1$'; do
            if grep -qE "$pat" files.txt; then
              echo "SHOULD NOT be in the package ($pat):"
              grep -E "$pat" files.txt
              fail=1
            fi
          done

          # @project-version@ substituted, and no literal version committed over it.
          tocs=$(grep -cE '\.toc$' files.txt || true)
          test "$tocs" -eq 1 || { echo "expected 1 TOC in the package, found $tocs"; fail=1; }
          v=$(grep -i '^## Version:' unpacked/GuildSpy/GuildSpy.toc | head -1)
          echo "GuildSpy.toc  ->  $v"
          case "$v" in
            "")                    echo "  no Version line at all"; fail=1 ;;
            *"@project-version@"*) echo "  keyword not substituted"; fail=1 ;;
            *dev*)                 echo "  a dev version was committed over the keyword"; fail=1 ;;
          esac

          exit $fail

      # Under Libs/LibGlass-1.0, exactly what the library ships: its XML, every
      # file the XML loads, LICENSE, Media/*.tga, and NOTHING else (its tests,
      # docs, Tools or a new notes file fail here instead of shipping). And none
      # of its textures left in our own Media/.
      - name: The package holds exactly the library's runtime files
        run: |
          lib=GuildSpy/Libs/LibGlass-1.0
          {
            echo "$lib/LibGlass-1.0.xml"
            echo "$lib/LICENSE"
            # Comments stripped non-greedily, as the test harness does.
            tr -d '\r' < "$LIBGLASS/LibGlass-1.0.xml" | perl -0pe 's/<!--.*?-->//gs' |
              sed -n 's/.*<Script file="\([^"]*\)".*/\1/p' | tr '\\' '/' | sed "s|^|$lib/|"
            (cd "$LIBGLASS" && ls Media/*.tga) | sed "s|^|$lib/|"
          } | sort > expected.txt
          (cd unpacked && find . -type f | sed 's|^\./||' | sort) | grep "^$lib/" > actual.txt || true
          echo "library files expected: $(wc -l < expected.txt) ($(grep -c "^$lib/Media/" expected.txt) textures)"
          if ! diff -u expected.txt actual.txt; then
            echo "the packaged library differs from what it ships (- missing, + extra)"
            exit 1
          fi
          stale=$( (cd "$LIBGLASS" && ls Media/*.tga) | while read -r t; do
            if [ -e "unpacked/GuildSpy/$t" ]; then echo "$t"; fi; done )
          if [ -n "$stale" ]; then
            echo "library textures also in GuildSpy/Media/: $stale"; exit 1
          fi

      # The packager fetched its own copy of the library; prove it embedded the
      # pinned commit's content (the same files the tests just ran against). Its
      # text filter rewrites .lua/.xml with CRLF, so those compare with CRs
      # stripped; everything else (textures, LICENSE) must match byte for byte.
      - name: The packaged library is the pinned commit
        run: |
          lib=unpacked/GuildSpy/Libs/LibGlass-1.0
          bad=0
          while read -r f; do
            case "$f" in
              *.lua|*.xml) cmp -s <(tr -d '\r' < "$lib/$f") <(tr -d '\r' < "$LIBGLASS/$f") ;;
              *) cmp -s "$lib/$f" "$LIBGLASS/$f" ;;
            esac || { echo "differs from the pinned checkout: $f"; bad=1; }
          done < <(cd "$lib" && find . -type f | sed 's|^\./||')
          test "$bad" -eq 0

      # .release is hidden, and upload-artifact@v4 skips hidden content unless
      # told otherwise: without this the upload finds nothing and stays green.
      - name: Keep the zip for inspection
        uses: actions/upload-artifact@v4
        with:
          name: guildspy-package
          path: .release/*.zip
          include-hidden-files: true
          if-no-files-found: error
